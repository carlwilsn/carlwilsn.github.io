<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <!-- background -->
  <rect width="480" height="280" fill="#fff"/>

  <!-- plot area: x in [60, 460], y in [30, 240] -->
  <!-- gridlines -->
  <g stroke="#eee" stroke-width="1">
    <line x1="60" y1="240" x2="460" y2="240"/>
    <line x1="60" y1="187" x2="460" y2="187"/>
    <line x1="60" y1="135" x2="460" y2="135"/>
    <line x1="60" y1="82"  x2="460" y2="82"/>
    <line x1="60" y1="30"  x2="460" y2="30"/>
  </g>

  <!-- axes -->
  <g stroke="#515151" stroke-width="1">
    <line x1="60" y1="30"  x2="60"  y2="240"/>
    <line x1="60" y1="240" x2="460" y2="240"/>
  </g>

  <!-- y-axis ticks/labels (loss: 0..4) -->
  <g fill="#9a9a9a">
    <text x="54" y="243" text-anchor="end">0</text>
    <text x="54" y="190" text-anchor="end">1</text>
    <text x="54" y="138" text-anchor="end">2</text>
    <text x="54" y="85"  text-anchor="end">3</text>
    <text x="54" y="33"  text-anchor="end">4</text>
  </g>

  <!-- x-axis ticks/labels (steps: 0..5000) -->
  <g fill="#9a9a9a">
    <text x="60"  y="258" text-anchor="middle">0</text>
    <text x="140" y="258" text-anchor="middle">1k</text>
    <text x="220" y="258" text-anchor="middle">2k</text>
    <text x="300" y="258" text-anchor="middle">3k</text>
    <text x="380" y="258" text-anchor="middle">4k</text>
    <text x="460" y="258" text-anchor="middle">5k</text>
  </g>

  <!-- axis titles -->
  <text x="260" y="276" text-anchor="middle" fill="#515151">step</text>
  <text x="18"  y="135" text-anchor="middle" fill="#515151" transform="rotate(-90 18 135)">loss</text>

  <!-- loss curve: approx 3.8 * exp(-step / 1500) + 0.5, with small noise -->
  <!-- sampled at every 100 steps -->
  <polyline fill="none" stroke="#268bd2" stroke-width="1.6" stroke-linejoin="round"
    points="60,40 68,50 76,58 84,67 92,73 100,82 108,89 116,96 124,104 132,110
            140,116 148,121 156,127 164,131 172,136 180,141 188,145 196,149
            204,152 212,156 220,159 228,162 236,165 244,168 252,170 260,173
            268,175 276,177 284,179 292,181 300,183 308,184 316,186 324,187
            332,189 340,190 348,191 356,193 364,194 372,195 380,196 388,197
            396,197 404,198 412,199 420,199 428,200 436,200 444,201 452,201 460,202"/>

  <!-- caption marker -->
  <g>
    <line x1="220" y1="159" x2="260" y2="100" stroke="#9a9a9a" stroke-width="1"/>
    <text x="263" y="98" fill="#515151">step 2000: loss 1.6, lr warmup done</text>
  </g>
</svg>
